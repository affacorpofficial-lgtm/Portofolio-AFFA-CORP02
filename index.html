<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFFA CORP</title>
<meta name="description" content="Portofolio resmi AFFA CORP, perusahaan kreatif independen.">
<meta name="theme-color" content="#101416">
<!-- LOGO: ganti file di assets/images/affa-logo.png -->
<link rel="icon" href="assets/images/affa-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="loading">

<!-- ANIMASI PEMBUKA -->
<div id="preloader" aria-hidden="true">
  <div class="logo-crop"><img src="assets/images/affa-logo.png" alt=""></div>
  <p class="pre-name" data-bind="company"></p>
</div>

<!-- NAVBAR UTAMA -->
<header id="navbar" class="navbar">
  <nav class="nav-inner" aria-label="Navigasi utama">
    <button class="nav-btn" data-go="vision">Home</button>
    <button class="nav-btn" data-go="projects">Projects</button>
    <button class="nav-btn" data-go="founder">Founder</button>
  </nav>
</header>

<!-- TOMBOL KEMBALI (hanya tampil di halaman detail novel) -->
<button id="backBtn" class="back-btn" aria-label="Kembali ke Projects">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  <span>Back</span>
</button>

<!-- HALAMAN UTAMA -->
<div id="page" class="page">
  <main>
    <section id="hero" class="hero">
      <div class="logo-crop hero-logo hx" style="--i:0"><img src="assets/images/affa-logo.png" alt="Logo AFFA CORP"></div>
      <h1 class="hero-title hx" style="--i:1" data-bind="company"></h1>
      <p class="slogan hx" style="--i:2" data-bind="slogan"></p>
      <p class="hero-desc hx" style="--i:3" data-bind="heroDesc"></p>
      <button class="btn btn-primary hx" style="--i:4" data-go="vision">Explore Our Vision</button>
      <span class="scroll-hint hx" style="--i:5" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </span>
    </section>

    <section id="vision" class="section">
      <div class="container">
        <header class="sec-head reveal">
          <h2>Our Vision &amp; Mission</h2>
          <p data-bind="visionIntro"></p>
        </header>
        <div class="cards" id="visionCards"></div>
      </div>
    </section>

    <section id="projects" class="section alt">
      <div class="container">
        <header class="sec-head reveal">
          <h2>Our Creative Projects</h2>
          <p data-bind="projectsIntro"></p>
        </header>
        <div class="grid" id="projectGrid"></div>
      </div>
    </section>

    <section id="founder" class="section">
      <div class="container">
        <header class="sec-head reveal">
          <h2>The Founder</h2>
          <p data-bind="founderIntro"></p>
        </header>
        <div class="founder" id="founderWrap"></div>
      </div>
    </section>
  </main>

  <footer id="footer">
    <div class="container">
      <div class="foot-brand">
        <div class="logo-crop foot-logo"><img src="assets/images/affa-logo.png" alt="Logo AFFA CORP"></div>
        <strong data-bind="company"></strong>
        <span data-bind="slogan"></span>
      </div>
      <nav class="foot-links" aria-label="Navigasi footer">
        <button class="foot-link" data-go="vision">Home</button>
        <button class="foot-link" data-go="projects">Projects</button>
        <button class="foot-link" data-go="founder">Founder</button>
      </nav>
      <p class="copy">&copy; 2026 AFFA CORP. All rights reserved.</p>
    </div>
  </footer>
</div>

<!-- TEMPLATE DETAIL NOVEL (dipakai oleh semua novel, diisi dari script.js) -->
<section id="detail" class="detail" aria-label="Detail novel">
  <div class="container detail-grid">
    <div class="d-cover" id="dCover"></div>
    <div class="d-info">
      <p class="d-genre" id="dGenre"></p>
      <h2 id="dTitle"></h2>
      <span class="status" id="dStatus"></span>
      <h3>Sinopsis</h3>
      <p id="dDesc"></p>
      <h3>Deskripsi Lengkap</h3>
      <p id="dDetails"></p>
      <dl class="extra" id="dExtra"></dl>
      <div class="d-actions">
        <button class="btn btn-ghost" id="dBack">Back to Projects</button>
        <span id="dReadSlot"></span>
      </div>
    </div>
  </div>
</section>

<!-- PEMBACA NOVEL (Read More). Isinya diatur script.js; naskah ada di naskah.js -->
<section id="reader" class="reader r-dark" data-mode="page" aria-label="Pembaca novel">
  <header class="r-bar">
    <button class="r-back" id="rBack" aria-label="Kembali ke halaman novel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Kembali</button>
    <div class="r-title"><strong id="rNovel"></strong><span id="rChap"></span></div>
    <button class="r-ico" id="rTheme" aria-label="Ganti mode gelap / terang"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <div class="r-ctl"><div class="r-seg" id="rMode" role="group" aria-label="Mode baca"><button data-m="page">Halaman</button><button data-m="scroll">Scroll</button></div><select id="rSelect" aria-label="Pilih bab"></select></div>
  </header>
  <div class="r-body" id="rBody"><div class="r-sheet"><div class="r-view" id="rView"><article class="r-text" id="rText"></article></div></div></div>
  <footer class="r-foot"><button id="rPrev">‹ Sebelumnya</button><span id="rInfo"></span><button id="rNext">Selanjutnya ›</button></footer>
</section>

<script src="naskah.js"></script>
<script src="script.js"></script>
</body>
</html>
